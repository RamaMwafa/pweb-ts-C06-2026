<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operator - Antrian Rumah Sakit</title>
    <!-- operator.css telah disatukan ke style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigasi Atas -->
    <header class="operator-nav">
        <div class="nav-brand">
            <h1>Panel Operator</h1>
            <span class="user-info">
                Operator: <strong id="username">-</strong>
                <span id="role-badge" class="badge-role">OPERATOR</span>
            </span>
        </div>

        <nav class="operator-nav-links" style="display: flex; gap: 16px; align-items: center; margin: 0 16px;">
            <a href="index.html" class="direct-link" style="font-size: 0.9rem;">Dashboard Admin</a>
            <a href="layar.html" class="direct-link" style="font-size: 0.9rem;">Layar Monitor</a>
            <a href="ambil-antrian.html" class="direct-link" style="font-size: 0.9rem;">Ambil Antrian</a>
        </nav>

        <div class="nav-actions">
            <!-- Toggle Suara Suara Panggilan (Bonus Nilai Web Speech API) -->
            <button id="btn-sound-toggle" class="btn-toggle-sound" type="button" title="Aktifkan/Nonaktifkan Suara Panggilan">
                🔊 Suara: Aktif
            </button>

            <!-- Tombol Tambah Tiket Uji (Untuk simulasi antrian) -->
            <button id="btn-open-modal" class="btn-quick-ticket" type="button" title="Ambil / terbitkan tiket baru">
                + Ambil Tiket
            </button>

            <!-- Tombol Reset Sesuai Contoh Modul -->
            <button id="btn-reset-data" class="btn-reset" type="button" title="Reset data antrian ke contoh modul">
                🔄 Reset Contoh
            </button>

            <!-- Tombol Keluar (Logout) -->
            <button id="logout" class="btn-logout" type="button">Keluar</button>
        </div>
    </header>

    <!-- Konten Utama: Panel Grid Kartu Jenis Antrian -->
    <main class="operator-main">
        <div class="panel-grid" id="panel">
            <!-- Kartu setiap jenis antrian dirender secara dinamis oleh operator.ts -->
        </div>
    </main>

    <!-- Modal Terbitkan Tiket Baru (Self-service / Admin Simulation) -->
    <div id="ticket-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Terbitkan Tiket Antrian Baru</h3>
                <button type="button" id="modal-close" class="modal-close-btn">&times;</button>
            </div>
            <form id="form-new-ticket">
                <div class="form-group">
                    <label for="select-queue-type">Jenis Antrian / Loket:</label>
                    <select id="select-queue-type" required>
                        <!-- Pilihan otomatis dari daftar jenis antrian -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="select-priority">Tingkat Prioritas:</label>
                    <select id="select-priority" required>
                        <option value="Normal">Normal</option>
                        <option value="Lansia">Lansia</option>
                        <option value="Disabilitas">Disabilitas</option>
                        <option value="VIP">VIP</option>
                    </select>
                </div>

                <div class="modal-buttons">
                    <button type="button" id="modal-cancel" class="btn-cancel">Batal</button>
                    <button type="submit" class="btn-submit" style="width: auto;">Ambil Nomor</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifikasi Ringan -->
    <div id="toast" class="toast" style="display: none;"></div>

    <!-- Script Kompilasi TypeScript -->
    <script src="dist/common.js" defer></script>
    <script src="dist/operator.js" defer></script>
</body>
</html>
